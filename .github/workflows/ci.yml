name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -m "not integration"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # scan the whole history, not only the last commit
      # Gitleaks runs straight from its image: no license, no Node runtime, and no
      # "first push" failure (the action breaks when there is no previous commit to diff).
      - name: Gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo:ro" --entrypoint sh zricethezav/gitleaks:v8.21.2 -c \
            "git config --global --add safe.directory /repo && gitleaks git /repo --redact --no-banner"

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Audit this repository (fails on high severity)
        run: devops-agent --lang en audit --fail-on high --no-docker
      # Each evaluation scenario must pass with its reference fix and fail when nothing is done (no model needed).
      - name: Check the evaluation scenarios
        run: devops-agent --lang en eval --validate

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t devops-agent:ci .
      - name: Smoke test
        run: docker run --rm devops-agent:ci --help
