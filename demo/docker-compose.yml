# Containers broken on purpose, to try the agent.
#   docker compose -f demo/docker-compose.yml up -d
#   devops-agent check
#   docker compose -f demo/docker-compose.yml down
name: devops-agent-demo

services:
  # Healthy: the control group.
  web:
    image: nginx:alpine
    container_name: demo-web
    ports:
      - "8080:80"

  # The healthcheck probes the wrong port (8081), so the container turns "unhealthy".
  web-unhealthy:
    image: nginx:alpine
    container_name: demo-web-unhealthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8081/"]
      interval: 10s
      timeout: 3s
      retries: 2

  # Crashes because the database does not exist. Restarting will not help.
  api:
    image: alpine:3.20
    container_name: demo-api
    restart: "no"
    command: ["sh", "-c", "echo 'Starting API on port 3000...'; sleep 3; echo 'ERROR: could not connect to database at postgres:5432 (connection refused)'; exit 1"]

  # A required environment variable is missing; with restart: always it loops forever.
  worker:
    image: alpine:3.20
    container_name: demo-worker
    restart: always
    command: ["sh", "-c", "echo 'worker started'; sleep 5; echo 'panic: missing required environment variable QUEUE_URL'; exit 2"]
