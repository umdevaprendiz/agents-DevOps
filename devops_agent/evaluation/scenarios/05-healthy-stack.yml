# Control scenario: everything works. A good agent says so and proposes nothing.
id: healthy-stack
title:
  en: Healthy stack (nothing to fix)
  pt-BR: Ambiente saudável (nada para corrigir)
focus: ""

files:
  docker-compose.yml: |
    services:
      web:
        image: nginxinc/nginx-unprivileged:1.27-alpine
        ports:
          - "127.0.0.1:8080:8080"
        healthcheck:
          test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
          interval: 10s
          timeout: 3s
          retries: 3
        mem_limit: 128m
        restart: unless-stopped
      api:
        build: ./api
        environment:
          PORT: "3000"
        mem_limit: 256m
        restart: unless-stopped
  api/Dockerfile: |
    FROM python:3.12-slim
    WORKDIR /app
    COPY app.py .
    USER 10001
    HEALTHCHECK --interval=10s CMD python -c "import urllib.request; urllib.request.urlopen('http://localhost:3000/health')"
    CMD ["python", "app.py"]
  api/app.py: |
    import json
    import os
    from http.server import BaseHTTPRequestHandler, HTTPServer


    class Handler(BaseHTTPRequestHandler):
        def do_GET(self) -> None:
            body = json.dumps({"status": "ok"}).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.end_headers()
            self.wfile.write(body)


    if __name__ == "__main__":
        port = int(os.environ.get("PORT", "3000"))
        print(f"api listening on {port}", flush=True)
        HTTPServer(("0.0.0.0", port), Handler).serve_forever()

containers:
  - name: web
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart_policy: unless-stopped
    memory_mb: 128
    user: "101"
    healthcheck: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
    health: healthy
    health_log: ["<!doctype html>", "<!doctype html>", "<!doctype html>"]
    ports:
      8080/tcp: ["127.0.0.1:8080"]
    command: ["nginx", "-g", "daemon off;"]
    env: [PATH, NGINX_VERSION]
    logs: |
      /docker-entrypoint.sh: Configuration complete; ready for start up
      2026/10/23 18:00:01 [notice] 1#1: nginx/1.27.2
      2026/10/23 18:00:01 [notice] 1#1: start worker processes
      172.18.0.1 - - [23/Oct/2026:18:03:12 +0000] "GET / HTTP/1.1" 200 615 "-" "Mozilla/5.0"
  - name: api
    image: shop-api:latest
    restart_policy: unless-stopped
    memory_mb: 256
    user: "10001"
    command: ["python", "app.py"]
    healthcheck: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:3000/health')\""]
    health: healthy
    health_log: ["", "", ""]
    env: [PORT, PATH, PYTHON_VERSION]
    logs: |
      api listening on 3000
      172.18.0.3 - - [23/Oct/2026 18:03:12] "GET /health HTTP/1.1" 200 -
      172.18.0.3 - - [23/Oct/2026 18:03:22] "GET /health HTTP/1.1" 200 -

expect:
  no_changes: true

reference:
  answer: >-
    Both containers (web and api) are running and healthy, their logs show no errors and the
    project files are consistent. Nothing needs to change.
